# Builds Doc Monster on Windows, macOS and Linux, runs the tests there, and attaches the
# programs to a GitHub release. Runs when a version tag (v0.1.0, v0.2.0, ...) is pushed,
# or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: doc-monster-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: doc-monster-macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: doc-monster-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # FFmpeg and Tesseract are required for videos; the video tests use them.
      - name: Install FFmpeg and Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - name: Install FFmpeg and Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg tesseract
      - name: Install FFmpeg and Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg tesseract -y --no-progress
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Test
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/doc-monster .
          tar czf ${{ matrix.archive }} doc-monster README.md INSTALL.md
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/doc-monster.exe .
          Compress-Archive -Path doc-monster.exe, README.md, INSTALL.md -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: doc-monster-*
          generate_release_notes: true
