# Builds the static Linux doc-monster with FFmpeg and Tesseract built in (Linux Binary/build.sh)
# after every push to main, tests it, and publishes it:
#   - as a download on the run (Actions tab), and
#   - on the "linux-latest" pre-release, a stable link that always holds the newest build.
name: Linux binary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build still running for an older one.
concurrency:
  group: linux-binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake nasm musl-tools python3-pip

      # FFmpeg, Leptonica and Tesseract take about 10 minutes to build; build.sh skips any that
      # are already built, so keep them between runs until build.sh changes.
      - name: Reuse built tools
        uses: actions/cache@v4
        with:
          path: target/bundled-tools
          key: bundled-tools-linux-${{ hashFiles('scripts/build-tools.sh') }}

      - name: Build
        run: bash "Linux Binary/build.sh"

      - name: Test with the tools built in
        env:
          DOC_MONSTER_TOOLS: ${{ github.workspace }}/target/bundled-tools/linux/tools
        run: cargo test --release --locked --target x86_64-unknown-linux-musl --features bundled-tools

      - name: Check it runs videos with nothing installed
        run: |
          B="$PWD/Linux Binary/doc-monster"
          file "$B" | grep -q "static"
          ldd "$B" 2>&1 | grep -q "statically linked\|not a dynamic executable"
          dir="$(mktemp -d)"
          cp tests/fixtures/slides.mkv "$dir/"
          env -i HOME="$dir/home" PATH=/nonexistent "$B" feed "$dir/slides.mkv" --no-anim
          grep -q "On screen" "$dir/slides.md"
          grep -q "Aurora Dev Update" "$dir/slides.md"
          # Pictures too: the built-in FFmpeg must open PNG and JPEG.
          cp tests/fixtures/sign.png tests/fixtures/sign.jpg "$dir/"
          env -i HOME="$dir/home" PATH=/nonexistent "$B" gorge "$dir/sign.png" "$dir/sign.jpg" --no-anim
          grep -q "Aurora Pet Shop Notice" "$dir/sign.md"
          grep -q "Aurora Pet Shop Notice" "$dir/sign.v2.md"

      - name: Build the wheel (uv)
        env:
          DOC_MONSTER_TOOLS: ${{ github.workspace }}/target/bundled-tools/linux/tools
        run: |
          python3 -m pip install --quiet --user maturin || python3 -m pip install --quiet --user --break-system-packages maturin
          ~/.local/bin/maturin build --release --locked --target x86_64-unknown-linux-musl --features bundled-tools --out dist

      - name: Fingerprint
        id: sum
        run: |
          cd "Linux Binary"
          sha256sum doc-monster | tee doc-monster.sha256
          echo "sha=$(cut -d' ' -f1 doc-monster.sha256)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: doc-monster-linux-x86_64
          path: |
            Linux Binary/doc-monster
            Linux Binary/doc-monster.sha256
            Linux Binary/README.md
            Linux Binary/licenses/
            dist/*.whl

      - name: Publish to the linux-latest pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f linux-latest
          git push -f origin linux-latest
          notes="Static Linux x86_64 doc-monster with FFmpeg and Tesseract built in, from ${GITHUB_SHA::7}. SHA-256 ${{ steps.sum.outputs.sha }}. See Linux Binary/README.md."
          if gh release view linux-latest >/dev/null 2>&1; then
            gh release edit linux-latest --prerelease --title "Linux binary (latest main)" --notes "$notes"
          else
            gh release create linux-latest --prerelease --title "Linux binary (latest main)" --notes "$notes"
          fi
          gh release upload linux-latest "Linux Binary/doc-monster" "Linux Binary/doc-monster.sha256" dist/*.whl --clobber
