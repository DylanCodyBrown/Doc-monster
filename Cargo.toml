[package]
name = "doc-monster"
version = "0.3.0"
edition = "2024"
description = "Eats documents, writes clean Markdown with a notebook-style summary beside each one. Free, offline, no model."
license = "MIT OR Apache-2.0"
repository = "https://github.com/DylanCodyBrown/Doc-monster"
readme = "README.md"
keywords = ["markdown", "summary", "docx", "ocr", "converter"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1.0.104"
calamine = "0.38.0"
cfb = "0.16.0"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
enable-ansi-support = "0.3.1"
flate2 = { version = "1.1.11", optional = true }
encoding_rs = "0.8.44"
htmd = "0.5.6"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_norway = "0.9.42"
thiserror = "2.0.21"
toml = "1.2.1"
walkdir = "2.5.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
terminal_size = "0.4.4"
candle-core = { version = "0.11.1", optional = true }
candle-transformers = { version = "0.11.1", optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
sha2 = { version = "0.11.1", optional = true }
ureq = { version = "3.5.1", optional = true, default-features = false, features = ["rustls", "platform-verifier"] }

[features]
# Build FFmpeg, ffprobe and Tesseract into the program (see Linux Binary/README.md).
bundled-tools = ["dep:flate2"]
# Transcript mode: meetings summarised as goal, outcome, summary and miscellaneous
# (--transcript). Only the standalone Linux binary is built with it.
transcript = []
# Topic summaries written by a local language model (Qwen2.5 1.5B Instruct, run with candle):
# --summarizer model. The model is downloaded once, on first use. Needs transcript mode.
model = ["transcript", "dep:candle-core", "dep:candle-transformers", "dep:tokenizers", "dep:sha2", "dep:ureq"]

[build-dependencies]
flate2 = "1.1.11"

[dev-dependencies]
docx-rs = "0.4.22"
rust_xlsxwriter = "0.102.0"
tempfile = "3.27.0"

# Smaller, faster binary: one optimisation unit, link-time optimisation, no debug symbols.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"
