[package]
name = "doc-monster"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
calamine = "0.38.0"
cfb = "0.16.0"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
enable-ansi-support = "0.3.1"
encoding_rs = "0.8.44"
htmd = "0.5.6"
mp4 = "0.14.0"
pdf-extract = "0.12.1"
quick-xml = "0.42.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_norway = "0.9.42"
thiserror = "2.0.21"
toml = "1.2.1"
ureq = { version = "3.5.1", default-features = false, features = ["json"] }
walkdir = "2.5.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
docx-rs = "0.4.22"
rust_xlsxwriter = "0.102.0"
tempfile = "3.27.0"

# Smaller, faster binary: one optimisation unit, link-time optimisation, no debug symbols.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
